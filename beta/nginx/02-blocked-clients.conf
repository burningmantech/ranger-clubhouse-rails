# ---------------------------------------------------------------
# Client classification. Header heuristics (missing Accept, HTTP/1.0)
# are intentionally omitted — Cloudflare handles those far better.
# ---------------------------------------------------------------

# Programmatic HTTP client libraries
map $http_user_agent $bad_client {
    default 0;
    ""                       1;
    "~*^curl"                1;
    "~*^wget"                1;
    "~*^python-(requests|urllib|httpx)" 1;
    "~*aiohttp"              1;
    "~*^go-http-client"      1;
    "~*^java/"               1;
    "~*^apache-httpclient"   1;
    "~*okhttp"               1;
    "~*^libwww-perl"         1;
    "~*^lwp-trivial"         1;
    "~*^ruby"                1;
    "~*^php/"                1;
    "~*guzzlehttp"           1;
    "~*^node-fetch"          1;
    "~*^axios"               1;
    "~*^undici"              1;
    "~*^dotnet"              1;
    "~*^powershell"          1;
    "~*^httpie"              1;
    "~*^scrapy"              1;
    "~*^colly"               1;
    "~*^winhttp"             1;
    "~*^Mozilla/[45]\.0$"    1;   # bare UA string, only scanners send this
}

# Vulnerability scanners and unwanted crawlers
map $http_user_agent $bad_scanner {
    default 0;
    "~*masscan|zgrab|zmap|nmap|nikto|sqlmap|wpscan|nuclei|acunetix|nessus|openvas" 1;
    "~*dirbuster|gobuster|feroxbuster|ffuf|dirb|wfuzz|burpsuite|netsparker|w3af|arachni|skipfish|whatweb|joomscan|droopescan" 1;
    "~*censys|shodan|internet-measurement|paloaltonetworks|expanse" 1;
    "~*ahrefsbot|semrushbot|mj12bot|dotbot|petalbot|bytespider" 1;
    "~*gptbot|ccbot|claudebot|anthropic-ai|google-extended|amazonbot" 1;
}

# OIDC discovery is fetched by the relying party's backend (Go/Ruby/Python/Java HTTP
# libraries, sometimes with no User-Agent at all), never by a browser, so the client
# block must not apply to it. Scanners are still refused there.
map $uri $oidc_discovery {
    default 0;
    /.well-known/openid-configuration 1;
}

# Final decision. Cloudflare services always pass; OIDC discovery passes unless it is a scanner.
map "$oidc_discovery$cf_service$bad_client$bad_scanner" $block_client {
    default 0;
    "~^1..1" 1;
    "~^1"    0;
    "~^01"   0;
    "~^001"  1;
    "~^0001" 1;
}

# Attack signatures in the raw, undecoded request URI (path and query string).
# One pattern per line: nginx has no regex line continuation, so a pattern wrapped
# across lines carries the newline and indent inside it and silently never matches.
# Location blocks cannot do this job: they only see the decoded, already normalised
# path, where "../" no longer exists.
map $request_uri $bad_uri {
    default 0;
    "~*(\.|%2e)(\.|%2e)(/|\\\\|%2f|%5c)"                                        1;  # traversal, plain or encoded
    "~*%00|^[^?]*%25(2e|2f|5c|00)"                                              1;  # null byte; double-encoded path
    "~*(<|%3c)script|>|%3e"                                                     1;  # XSS
    "~*union(%20|\+)+(all(%20|\+)+)?select|concat(\(|%28)|information_schema"   1;  # SQL injection
    "~*base64_decode|eval(\(|%28)|phpinfo"                                      1;  # PHP code injection, /?phpinfo=1
    "~*(ftp|php|data|file|gopher)(:|%3a)(//|%2f%2f)"                            1;  # RFI/SSRF. Not http(s): /sso/authorize carries a redirect_uri
    "~*\$\{|%24%7b|jndi:"                                                       1;  # Log4Shell, template injection
}

# Rate limiting — keyed on the REAL client IP thanks to real_ip above.
# Applied in 03-nginx.conf; a zone on its own limits nothing.

limit_req_zone  $binary_remote_addr zone=general:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=perip:10m;
limit_req_status  429;
limit_conn_status 429;

