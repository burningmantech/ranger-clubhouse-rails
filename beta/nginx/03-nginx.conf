
server_tokens off;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    server_name _;
    access_log /var/log/nginx/access.log cf;

    # Terminate the TLS handshake if the SNI doesn't match an explicit server block
    ssl_reject_handshake on;

    # Whatever once lived on this address is gone; 410 gets crawlers to drop it.
    return 410;
}

server {
    listen 80;
    listen [::]:80;

    server_name clubhouse3.dev;
    access_log /var/log/nginx/access.log cf;
    return 301 https://clubhouse3.dev$request_uri;
}

server {
    server_name clubhouse3.dev;
    # http/2
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    listen 443 quic reuseport;         # UDP listener for QUIC / HTTP/3
    http3 on;
    quic_retry on;     # Mitigates amplification attacks
    ssl_early_data on; # Enables 0-RTT for faster reconnection


    access_log /var/log/nginx/access.log cf;

    ssl_certificate /etc/nginx/certs/live/clubhouse3.dev/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/clubhouse3.dev/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Allow uploads up to a specific size (PersonPhoto::MAX_FILE_SIZE is 20M).
    client_max_body_size 40M;

    # Slowloris: Cloudflare sends the headers at once, nothing honest needs the default 60s.
    client_header_timeout 15s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;

    gzip_buffers 16 8k;
    gzip_types  text/plain
                text/css
                application/json
                application/javascript
                text/xml
                application/xml
                application/xml+rss
                text/javascript;

    # Sent to HTTP/2 clients so they switch to HTTP/3 on subsequent requests
    add_header Alt-Svc 'h3=":443"; ma=86400' always;

    # ---- Reject before doing any real work. Server-level, so every location is covered. ----

    # Only Cloudflare may talk to this vhost. Otherwise anyone who finds the origin address
    # skips Cloudflare's WAF by sending "Host: clubhouse3.dev" straight here.
    # Comment out to reach the origin directly (Cloudflare outage, debugging on the host).
    if ($from_cloudflare = 0) {
        return 400;
    }

    # Only allow the methods used
    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) {
        return 400;
    }

    if ($block_client) {
        return 400;
    }

    # Requests with no Host header, or a Host that isn't one of yours
    # (catches IP-address scanning of the whole subnet)
    if ($host !~* ^(clubhouse3\.dev)$) {
        return 400;
    }

    # Traversal, injection and XSS signatures: see 02-blocked-clients.conf
    if ($bad_uri) {
        return 400;
    }

    if ($request_uri ~* "[\x00-\x1F\x7F-\xFF]") {
        return 400;
    }

    # ---- URL fishing. None of this exists here, so it never needs to reach Rails. ----

    # Retired paths. "^~" is a plain prefix match, not a regex: no escaping, no alternation.
    location /pub {
        return 410;
    }

    location /api {
        return 410;
    }

    location /~ {
        return 410;
    }

    location /user {
	return 400;
    }

    location /account {
	return 400;
    }

    location /server-status {
	return 400;
    }

    location /manager {
	   return 400;
    }

    location /static {
	    return 400;
    }

    location /dashboard {
	    return 400;
    }

    location /SDK {
	    return 400;
    }

    location /open {
	    return 400;
    }

    location /@ {
	    return 400;
    }

    location /mcp {
	    return 400;
     }

     location /wordpress {
	     return 400;
     }

     location /blog {
	     return 400;
     }

     location /wp {
	     return 400;
     }

     location = /favicon.ico {
        return 404;
     }

    # WordPress and PHP admin tools, matched from the start of a path segment. Unanchored,
    # "pma" also matches inside the random base64 of a signed Active Storage URL.
    location ~* /(wp-|wp\d*(/|$)|wordpress|xmlrpc|(php)?myadmin|pma|adminer|phpinfo|cgi-bin) {
        return 400;
    }

    # Other stacks' management endpoints and package manifests, whole segments only.
    location ~* /(actuator|telescope|_profiler|_ignition|server-(status|info)|ecp|owa|autodiscover|composer\.(json|lock)|package(-lock)?\.json|web\.config)(/|$) {
        return 400;
    }

    # Credential and config hunting, any extension: /credentials.csv, /aws/s3/credentials, /env.js,
    # /config/stripe.js, /stripe.config.ts, /Dockerfile, /id_rsa. First segment only, so a real
    # route may still use one of these words further down (/admin/config).
    location ~* ^/(aws(-credentials)?|s3|client|credentials|secrets?|env|config|[\w-]+\.config|dockerfile|id_(rsa|dsa|ecdsa|ed25519)|backups?|feed|rsc)(\.\w+)?(/|$) {
        return 400;
    }

    # Scripts and text files at the root: the real scripts live under /assets/. robots.txt stays
    # open, because a refused robots.txt reads as "crawl everything", /bookmark/ included.
    location ~* ^/(?!robots\.txt$)[^/]*\.(js|txt)$ {
        return 400;
    }

    # Debug consoles and other stacks' source and media trees. /_ covers /_next.
    location ~* ^/(_|debug|vendor|info|(media|lib|gist)/) {
        return 400;
    }

    # File types this app never serves: other languages' scripts, backups, archives, configs, keys.
    # Rails formats in use stay open: csv, ics. Nothing requests .json, .html or .xml by extension.
    location ~* \.(php\d?|phtml|phar|pl|py|rb|cgi|asp|aspx|ashx|asmx|axd|jsp|jspx|do|action|cfm|sh|bash|bak|backup|old|orig|save|json|swp|tmp|sql|html|xml|gz|tar|tgz|zip|rar|7z|log|ini|inc|conf|config|yml|mjs|yaml|toml|env|pem|key|crt|p12|pfx|tfvars|tfstate|properties|secret)([~/]|$) {
        return 400;
    }

    # Hidden files at any depth (.env.local, .git/HEAD, .ssh/id_rsa, app/.env ...), and the rest
    # of /.well-known/. OIDC discovery is the only dot path Rails serves.
    location ~ /\.(?!well-known/openid-configuration$) {
        return 400;
    }

    # "^~" skips the regex locations above: signed blob ids are random base64 and the
    # filenames are user supplied, so path heuristics produce false positives here.
    location ^~ /rails/active_storage/ {
        root /clubhouse3/storage;
        # Try serving the file directly from disk, fallback to Rails if not found
        try_files $uri @rails;
        expires 1y;
        add_header Cache-Control "public, no-transform";
	add_header QUIC-Status $http3;
    }

    location ~ ^/(assets|images|javascripts|stylesheets)/ {
        try_files $uri @rails;

        access_log off;
        gzip_static on;

        expires max;
        add_header Cache-Control public;

        add_header Last-Modified "";
        add_header ETag "";
	add_header QUIC-Status $http3;
        break;
    }

    # After the asset location on purpose: a PNG only exists under those paths or Active Storage
    # ("^~" above), so one anywhere else is a probe. nginx cannot see Rails' files to check.
    location ~* \.png$ {
        return 400;
    }

    location / {
        # Real people peak at 2 req/s and 6 per 10s on these pages (measured from the access
        # log). Photos and assets burst to 60+/s, which is why they are not limited here.
        limit_req  zone=general burst=40 nodelay;
        limit_conn perip 20;

	add_header QUIC-Status $http3;
        try_files $uri @rails;
    }

    # Action Cable: the WebSocket every signed-in page opens for live updates (a new message on
    # the navbar). It needs HTTP/1.1 and the Upgrade headers, which @rails does not send, and
    # Action Cable has no fallback: without them the handshake fails and nothing arrives live.
    # An exact match, so no regex location above can take the handshake first.
    location = /cable {
        # One handshake per page load counts against the same rate as any page. No limit_conn:
        # each open tab holds one connection for hours, and people behind one address (an HQ
        # desk, a camp's uplink) would reach perip 20.
        limit_req  zone=general burst=40 nodelay;

        # No long proxy_read_timeout: Action Cable pings every 3 seconds, so the default 60s
        # only closes a connection Rails has stopped answering, and the browser reconnects.
        set $web web;
        proxy_pass http://$web:3000;
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # The same rule as @rails: Rails believes these, so none may arrive from the client.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded         "";
        proxy_set_header Client-IP         "";
    }

    # Resolve the web container per request through Docker's DNS, so a rebuilt
    # container with a new address does not 502 until nginx is restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location @rails {
	add_header QUIC-Status $http3;
        proxy_read_timeout 600;
        set $web web;
        proxy_pass http://$web:3000;
        proxy_redirect off;

        # Rails believes every one of these, so none may arrive from the client.
        # Rack 3 reads "Forwarded" BEFORE X-Forwarded-*: "Forwarded: host=evil.example"
        # alone changes request.host, and with it every *_url the app generates.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded         "";
        # A Client-IP that disagrees with X-Forwarded-For makes Rails raise IpSpoofAttackError.
        proxy_set_header Client-IP         "";
    }
}

server {
    listen 10085;
    listen [::]:10085;
    server_name clubhouse3.dev;

    location / {
        proxy_pass http://mailpit:8025; # Replace with container or internal IP if needed

        # 1. Critical for Mailpit Host/Origin security validation
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 2. Critical for Mailpit Live UI Updates (WebSockets)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        # Optional: Adjust timeouts for long-lived WebSocket connections
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
