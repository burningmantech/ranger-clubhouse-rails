
server_tokens off;

# The load balancer's health checks arrive with the task's address as Host, a container
# health check with localhost. Nothing else does: Cloudflare and the load balancer route by
# name, and Rails' config.hosts answers 403 for a name that is not its own, so the main
# server below needs no Host check and no hostname: one image serves staging, training and
# production.
server {
    listen 80;
    server_name localhost "~^\d+\.\d+\.\d+\.\d+$";
    access_log off;

    location = /up {
        proxy_pass http://unix:/tmp/puma.sock;
        include /app/docker/nginx/proxy-headers.inc;
    }

    location / {
        return 400;
    }
}

server {
    listen 80 default_server;

    # Precompiled assets and public/ are served from here; everything else goes to Puma.
    root /app/public;
    access_log /dev/stdout cf;

    # Allow uploads up to a specific size (PersonPhoto::MAX_FILE_SIZE is 20M).
    client_max_body_size 40M;

    # Slowloris: Cloudflare sends the headers at once, nothing honest needs the default 60s.
    client_header_timeout 15s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;

    gzip_buffers 16 8k;
    gzip_types  text/plain
                text/css
                application/json
                application/javascript
                text/xml
                application/xml
                application/xml+rss
                text/javascript;

    # ---- Reject before doing any real work. Server-level, so every location is covered. ----

    # Only allow the methods used
    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) {
        return 400;
    }

    if ($block_client) {
        return 400;
    }

    # Traversal, injection and XSS signatures, off Active Storage URLs: see 02-blocked-clients.conf
    if ($refuse_uri) {
        return 400;
    }

    if ($request_uri ~* "[\x00-\x1F\x7F-\xFF]") {
        return 400;
    }

    # ---- URL fishing. None of this exists here, so it never needs to reach Rails. ----

    # Retired paths. "^~" is a plain prefix match, not a regex: no escaping, no alternation.
    # /api is Clubhouse 2's API prefix at the same hostnames: a stale client tab gets "gone".
    location /pub {
        return 410;
    }

    location /api {
        return 410;
    }

    location /~ {
        return 410;
    }

    location /user {
        return 400;
    }

    location /account {
        return 400;
    }

    location /server-status {
        return 400;
    }

    location /manager {
        return 400;
    }

    location /static {
        return 400;
    }

    location /dashboard {
        return 400;
    }

    location /SDK {
        return 400;
    }

    location /open {
        return 400;
    }

    location /@ {
        return 400;
    }

    location /mcp {
        return 400;
    }

    location /wordpress {
        return 400;
    }

    location /blog {
        return 400;
    }

    location /wp {
        return 400;
    }

    location = /favicon.ico {
        return 404;
    }

    # WordPress and PHP admin tools, matched from the start of a path segment. Unanchored,
    # "pma" also matches inside the random base64 of a signed Active Storage URL.
    location ~* /(wp-|wp\d*(/|$)|wordpress|xmlrpc|(php)?myadmin|pma|adminer|phpinfo|cgi-bin) {
        return 400;
    }

    # Other stacks' management endpoints and package manifests, whole segments only.
    location ~* /(actuator|telescope|_profiler|_ignition|server-(status|info)|ecp|owa|autodiscover|composer\.(json|lock)|package(-lock)?\.json|web\.config)(/|$) {
        return 400;
    }

    # Credential and config hunting, any extension: /credentials.csv, /aws/s3/credentials, /env.js,
    # /config/stripe.js, /stripe.config.ts, /Dockerfile, /id_rsa. First segment only, so a real
    # route may still use one of these words further down (/admin/config).
    location ~* ^/(aws(-credentials)?|s3|client|credentials|secrets?|env|config|[\w-]+\.config|dockerfile|id_(rsa|dsa|ecdsa|ed25519)|backups?|feed|rsc)(\.\w+)?(/|$) {
        return 400;
    }

    # Scripts and text files at the root: the real scripts live under /assets/. robots.txt stays
    # open, because a refused robots.txt reads as "crawl everything", /bookmark/ included.
    location ~* ^/(?!robots\.txt$)[^/]*\.(js|txt)$ {
        return 400;
    }

    # Debug consoles and other stacks' source and media trees. /_ covers /_next.
    location ~* ^/(_|debug|vendor|info|(media|lib|gist)/) {
        return 400;
    }

    # File types this app never serves: other languages' scripts, executables, backups, archives,
    # configs, keys. Rails formats in use stay open: csv, ics. Nothing requests .json, .html or
    # .xml by extension.
    location ~* \.(php\d?|phtml|phar|pl|py|rb|cgi|asp|aspx|ashx|asmx|axd|jsp|jspx|do|action|cfm|sh|bash|exe|dll|bak|backup|old|orig|save|json|swp|tmp|sql|html|xml|gz|tar|tgz|zip|rar|7z|log|ini|inc|conf|config|yml|mjs|yaml|toml|env|pem|key|crt|p12|pfx|tfvars|tfstate|properties|secret)([~/]|$) {
        return 400;
    }

    # Hidden files at any depth (.env.local, .git/HEAD, .ssh/id_rsa, app/.env ...), and the rest
    # of /.well-known/. OIDC discovery is the only dot path Rails serves.
    location ~ /\.(?!well-known/openid-configuration$) {
        return 400;
    }

    # "^~" skips the regex locations above: signed blob ids are random base64 and the
    # filenames are user supplied, so path heuristics produce false positives here.
    # Active Storage is on S3: Rails answers with a redirect to a signed URL.
    location ^~ /rails/active_storage/ {
        try_files $uri @rails;
    }

    location ~ ^/(assets|images|javascripts|stylesheets)/ {
        try_files $uri @rails;

        access_log off;
        gzip_static on;

        expires max;
        add_header Cache-Control public;

        add_header Last-Modified "";
        add_header ETag "";
        break;
    }

    # After the asset location on purpose: a PNG only exists under those paths or Active Storage
    # ("^~" above), so one anywhere else is a probe. nginx cannot see Rails' files to check.
    location ~* \.png$ {
        return 400;
    }

    # Health checkers and uptime monitors asking by hostname: no rate limit and no log line, like
    # the load balancer's own check above. Rails silences /up too.
    location = /up {
        access_log off;
        proxy_pass http://unix:/tmp/puma.sock;
        include /app/docker/nginx/proxy-headers.inc;
    }

    location / {
        # Real people peak at 2 req/s and 6 per 10s on these pages (measured from the access
        # log). Photos and assets burst to 60+/s, which is why they are not limited here.
        limit_req  zone=general burst=40 nodelay;
        limit_conn perip 20;

        try_files $uri @rails;
    }

    # Action Cable: the WebSocket every signed-in page opens for live updates (a new message on
    # the navbar). It needs HTTP/1.1 and the Upgrade headers, which @rails does not send, and
    # Action Cable has no fallback: without them the handshake fails and nothing arrives live.
    # An exact match, so no regex location above can take the handshake first.
    location = /cable {
        # One handshake per page load counts against the same rate as any page. No limit_conn:
        # each open tab holds one connection for hours, and people behind one address (an HQ
        # desk, a camp's uplink) would reach perip 20.
        limit_req  zone=general burst=40 nodelay;

        # No long proxy_read_timeout: Action Cable pings every 3 seconds, so the default 60s
        # only closes a connection Rails has stopped answering, and the browser reconnects.
        proxy_pass http://unix:/tmp/puma.sock;
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        include /app/docker/nginx/proxy-headers.inc;
    }

    location @rails {
        proxy_read_timeout 600;
        proxy_pass http://unix:/tmp/puma.sock;
        proxy_redirect off;
        include /app/docker/nginx/proxy-headers.inc;
    }
}
