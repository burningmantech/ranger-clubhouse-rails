# ---------------------------------------------------------------
# Who is talking to us. The TCP peer is always the AWS load balancer, with Cloudflare in
# front of it: the visitor's address is in Cloudflare's header. The private ranges rather
# than the VPC's own, so another VPC needs no edit; the task's security group admits only
# the load balancer anyway.
#
# Whether a request came through Cloudflare at all cannot be decided here: a load balancer
# may preserve X-Forwarded-For as sent (the org ALB) or append the edge address (the personal
# one), nginx believes neither, and CF-Connecting-IP is a header anyone can send. That gate is the load
# balancer's security group, which admits only Cloudflare's ranges
# (https://www.cloudflare.com/ips-v4).
# ---------------------------------------------------------------
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;

real_ip_header CF-Connecting-IP;

# Cloudflare's own services that hit the origin with minimal headers.
map $http_user_agent $cf_service {
    default 0;
    "~*Cloudflare-(Healthchecks|Traffic-Manager|Prefetch|SSLDetector|SpeedBrain|Workers|AlwaysOnline)" 1;
}

# Log the real client IP and the CF ray ID for tracing.
log_format cf '$remote_addr - $remote_user [$time_local] "$request" '
              '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
              'ray=$http_cf_ray blk=$block_client';
