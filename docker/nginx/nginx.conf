# nginx in front of Puma inside the image: bin/docker-server starts both. The filters and
# the server blocks are in conf.d/, ported from the beta's beta/nginx/ with the same file
# names, so `diff -r beta/nginx docker/nginx/conf.d` shows what the AWS copy changes.
# docker/nginx/check.sh proves the result; CI runs it inside the built image.
#
# Runs as the image's unprivileged user: the pid goes to /tmp, the logs to the container's
# stdout and stderr, and the Dockerfile hands /var/lib/nginx (the temp directories) and
# /var/log/nginx (the default error log, opened before -c is read) to that user.
daemon off;
worker_processes 1;   # one Puma behind it, one vCPU in the task
worker_rlimit_nofile 8192;   # Fargate's soft limit is 1024, under worker_connections below
# On QUIT (bin/docker-server) a worker waits for its connections to close, and every signed-in
# tab holds a /cable WebSocket for hours: close whatever is left after Puma's own 30 s drain,
# inside the task's 45 s stopTimeout.
worker_shutdown_timeout 35s;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
    # Every signed-in tab holds a /cable WebSocket for hours, and a proxied request uses two
    # connections (client and Puma): 1024 would cap a task at about 500 open tabs.
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    # Well above any load balancer idle timeout in use (300 s on the org ALB, 60 s on the personal
    # one), so nginx never closes an idle connection the load balancer is about to reuse, which it
    # would report as a 502. Raising the ALB attribute past this brings those back.
    keepalive_timeout 620s;

    include /app/docker/nginx/conf.d/*.conf;
}
