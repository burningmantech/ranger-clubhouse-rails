# Vehicle fixtures for autocomplete VehicleAdapter tests (D2).
#
# event_year is pinned to 2026 so the adapter default (Current.year, which is the
# real current year in test since groundhog-day time is unset) matches without an
# explicit :<year> suffix. Tests that must be year-independent pass ":2026".
#
# Reference these BY NAME (no fixtures :all ordering assumptions).

# Owner-labeled, approved personal vehicle. license_number "RANGER1" intentionally
# equals the callsign of the person fixture :plate_collision_ranger so the D2 guard
# test can prove that "!RANGER1" returns ONLY this vehicle, never the person.
approved_owner_vehicle:
  person: active_ranger
  type: "personal"
  status: "approved"
  event_year: 2026
  license_number: "RANGER1"
  license_state: "NV"
  rental_number: ""
  sticker_number: "PERMIT100"
  vehicle_type: "Car"
  vehicle_year: "2020"
  vehicle_make: "Toyota"
  vehicle_model: "Tacoma"
  vehicle_color: "White"
  vehicle_class: ""
  team_assignment: ""
  notes: ""
  request_comment: ""
  response: ""

