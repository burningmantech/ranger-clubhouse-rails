# Test fixtures for TrsFormat: the three TRS formats as the migration first
# seeded them (CreateTrsFormat::FORMATS), written out so the suite does not
# depend on that file. Reference these BY NAME: paid, unpaid, lsd.
#
# columns is JSON text, in single quotes, spelled the way the app writes it
# (JSON.generate: no space after a comma, null for an unused column). A YAML
# list here would be dumped as YAML text and fail the column's json_valid
# check, and a spaced spelling would load every row as already changed.
#
# The headers are the vendor's bytes: keep the literal &amp; and the double
# space in "Setup Access Pass  8/15".

paid:
  slug: "paid"
  columns: '[["First Name","first_name"],["Last Name","last_name"],["Email","email"],["Question: Method Of Delivery:","delivery_type"],["Question: Nickname/Project:","project_name"],["Question: Notes:","note"],["Request: $250 Ticket","spt"],["Request: $165 Vehicle Pass",null],["Request: Gift Ticket",null],["Request: Gift Vehicle Pass","gift_vp"],["Request: Transferrable $250 Ticket",null],["Request: Transferrable $165 Vehicle Pass",null],["Request: Transferrable Gift Ticket","gift_ticket"],["Request: Transferrable Gift Vehicle Pass",null],["Request: Transferrable $75 Vehicle Pass",null],["Request: $75 Vehicle Pass","sp_vp"]]'

