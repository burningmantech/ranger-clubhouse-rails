  person: echelon_ranger
  creator_person: echelon_ranger
  sender_person: echelon_ranger
  sender_type: person
  message_type: contact
  group: true
  reply_to_id: 1004 # search_group_crew
  subject: "Burn night crew"
  body: "I packed extra lanterns."
  body_text: "I packed extra lanterns."
  created_at: <%= 4.days.ago.to_fs(:db) %>

# RANGER1's answer to the radio thread, written in the editor: tag and
# attribute words (strong, href, https) are in its body but not its text, so a
# search for one finds nothing. Older than the swap thread's reply, so the
# threads keep their order.
search_radio_rich_reply:
  id: 1003
  person: inactive_ranger
  creator_person: plate_collision_ranger
  sender_person: plate_collision_ranger
  sender_type: person
  message_type: contact
  reply_to_id: 1002 # search_radio_archived
  subject: "Radio handoff"
  body: '<p>Bring the <strong>spare</strong> batteries to the <a href="https://example.org/depot">depot</a>.</p><p>Thanks!</p>'
  body_text: "Bring the spare batteries to the depot.\nThanks!"
  created_at: <%= 9.days.ago.to_fs(:db) %>
