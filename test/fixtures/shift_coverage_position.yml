# Test fixtures for ShiftCoveragePosition: the 29 posts of the four shift types
# in shift_coverage_group.yml, copied from what the migration seeds. Reference
# these BY NAME, <shift type>_<post>.
#
# Every post spells out its sort_index, 1 to N in the report's column order:
# the column is NOT NULL with no default, so one left out fails the load of
# every fixture in the suite. The ids are hashed from the labels, so the
# order the report shows can only come from sort_index.
#
# position_ids is JSON text, in single quotes: [position id] or
# [position id,"label"] per position, spelled the way the app writes it (no
# space after a comma). A YAML list here would be dumped as YAML text and fail
# the column's json_valid check, and a spaced spelling would load every
# multi-entry row as already changed.

