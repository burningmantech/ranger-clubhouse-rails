description: "Tells the Volunteer Coordinators a Ranger was put back to active"

subject: "[Clubhouse] {{ person.callsign }} automatic conversion to active"

body: |
  <p>
    Hello from the Clubhouse Bot,
  </p>

  <p>
    A Ranger has walked a non-training shift and has been restored to active status.
  </p>

  <table class="data-table">
    <tbody>
      <tr>
        <th>Who</th>
        <td>{{ person.callsign }}</td>
      </tr>
      <tr>
        <th>Old Status</th>
        <td>{{ old_status }}</td>
      </tr>
      <tr>
        <th>Converted when</th>
        <td>{{ converted_at }}</td>
      </tr>
      <tr>
        <th>Position worked</th>
        <td>{{ position_title }}</td>
      </tr>
      <tr>
        <th>Shift ended by</th>
        <td>{{ worker_callsign }}</td>
      </tr>
    </tbody>
  </table>

  <p>
    Forever your humble servant,<br>
    <br>
    The Clubhouse
  </p>
