description: "Sends new online course sign-in details"

subject: "[Clubhouse] Ranger Online Course Password Reset"

body: |
  <p>
    Hello {{ person.callsign }},
  </p>

  <p>
    The Online Course password was recently reset. This does NOT affect your Clubhouse account.
  </p>

  <p>
    To log into the Online Course website, use the following credentials:
  </p>

  <p>
    <b>Username: </b> {{ person.lms_username }}<br>
    Your username is your callsign in all lower case and ONLY has letters (a-z) and numbers (0-9).
    All spaces, dashes, and other special characters have been stripped out.
  </p>

  <p>
    <b>Password: </b> {{ password }}
  </p>

  <p>
    <b>The Online Course website: </b><br>
    <a href="{{ course_url }}">{{ course_url }}</a>
  </p>

  <p>
    Note: the above credentials are ONLY for the Online Course website, NOT the Clubhouse.
  </p>

  <p>
    After completing the Online Course, you will need to attend an In-Person Training.
  </p>

  <p>
    <b>Training Questions?</b> Contact the Ranger Training Academy at
    <a href="mailto:ranger-trainingacademy-list@burningman.org">ranger-trainingacademy-list@burningman.org</a>
  </p>

  <p>
    <b>Other Questions?</b> Contact the Ranger Volunteer Coordinators at
    {% render "shared/mailer/vc_email" %}
  </p>

  <p>
    Yours sincerely,<br>
    The Ranger Training Academy
  </p>
