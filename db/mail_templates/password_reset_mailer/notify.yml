description: The link that lets someone set a new password

subject: Ranger Clubhouse Password Reset

body: |
  <p>
    {{ greeting }},
  </p>
  <p>
    You recently requested to reset your password for your Black Rock Ranger Secret Clubhouse account.
    Click the button below to reset your password.
  </p>
  <div class="btn" style="background-color: #d97706;">
    <a href="{{ reset_url }}">Reset Your Password</a>
  </div>
  <p style="font-size: 14px; color: #666666;">
    This password reset link is only valid for the next 2 hours.
  </p>
  <hr style="border: none; border-top: 1px solid #eeeeee; margin: 16px 0;">
  <p style="font-size: 14px; color: #666666;">
    If you did not request a password reset, please ignore this email or contact us at
    <a href="mailto:{{ support_email }}" style="color: #d97706;">{{ support_email }}</a>.
  </p>
  <p style="font-size: 14px; color: #999999;">
    If you're having trouble with the button above, copy and paste this URL into your browser:<br>
    <a href="{{ reset_url }}" style="color: #d97706; word-break: break-all;">{{ reset_url }}</a>
  </p>
  <hr style="border: none; border-top: 1px solid #eeeeee; margin: 16px 0;">
  <p style="font-size: 14px; color: #999999;">
    The Black Rock Ranger Tech Team<br>
    <a href="mailto:{{ support_email }}" style="color: #d97706;">{{ support_email }}</a>
  </p>

text_body: |
  {{ greeting }},

  You recently requested to reset your password for your Black Rock Ranger Secret Clubhouse account.

  Reset your password by visiting this link:

  {{ reset_url }}

  This password reset link is only valid for the next 2 hours.

  If you did not request a password reset, please ignore this email or contact us at {{ support_email }}.

  The Black Rock Ranger Tech Team
  {{ support_email }}
