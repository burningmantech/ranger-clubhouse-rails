description: "Tells someone their badge photo needs redoing, and why"

subject: "Ranger Clubhouse photo submission REJECTED."

body: |
  <p>
    Hello from the Ranger Volunteer Coordinators,
  </p>

  <p>
    We regret to inform you that your photo submission has been rejected due to non-compliance with the BMID
    guidelines. Please review the guidelines carefully and resubmit your photo to avoid any further delays.
    Thank you for your cooperation.
  </p>

  <p>
    The BMID guidelines can be viewed by using <a href="https://docs.google.com/document/d/1hUqrJwdMG6XB5nk7Eh8nY2GH4uvAFTppmCKCmfidIvQ/edit">THIS LINK</a>.
  </p>

  <p>
    Log back into the <a href="{{ clubhouse_url }}">Ranger Secret Clubhouse</a> to submit a new
    photo.
  </p>

  {%- if is_applicant %}
    <p>
      <b>
        You must upload a photo for approval before being able to sign up for an In-Person Training or Alpha
        shift. No exceptions will be made.
      </b>
    </p>
  {%- endif %}

  <p>
    The following problem(s) were found with your photo submission:
  </p>
  <ul>
    {%- for reason in reject_reasons %}
      <li>
        {%- if reason.known %}
          {{ reason.message }}
        {%- else %}
          Uh oh, the reason [{{ reason.code }}] was marked, and I don't know what that is. This is a bug.
        {%- endif %}
      </li>
    {%- endfor %}
  </ul>

  {%- if reject_message %}
    <p>
      The photo reviewer has left additional information:
    </p>
    <p>
      {{ reject_message }}
    </p>
  {%- endif %}

  <p>
    <b>Questions?</b> Contact the Ranger Volunteer Coordinators at
    {% render "shared/mailer/vc_email" %}
  </p>

  <p>
    Yours sincerely,<br>
    The Ranger Volunteer Coordinators
  </p>
