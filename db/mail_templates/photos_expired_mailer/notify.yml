description: "Lists the archived photos that have been removed"

subject: "[Clubhouse] Photo expiration"

body: |
  <p>
    Hello Photo Maintainer,
  </p>

  <p>
    The following archived photos have been deleted.
  </p>

  <table class="data-table" style="margin-bottom: 20px">
    <thead>
      <tr>
        <th>Person #</th>
        <th>Callsign</th>
        <th>Photo Id</th>
        <th>Created At</th>
      </tr>
    </thead>
    <tbody>
      {%- for photo in photos %}
        <tr>
          <td>{{ photo.person_id }}</td>
          <td>{{ photo.callsign }}</td>
          <td>{{ photo.person_photo_id }}</td>
          <td>{{ photo.created_at }}</td>
        </tr>
      {%- endfor %}
    </tbody>
  </table>

  {% render "shared/mailer/bot_sign_off" %}
