description: "Asks an applicant about their reasons for wanting to Ranger"

subject: "Hey {{ application.first_name }}, Ranger Application is on hold and needs attention!"

body: |
  <p>
    Hey {{ application.first_name }} {{ application.last_name }},
  </p>
  <p>
    The Ranger Volunteer Coordinators have reviewed your application and have a question about your
    response to the <i>Why Do You Want to Ranger?</i> section.
  </p>
  {% render "shared/mailer/on_hold" %}
  <p>
    Here is the message from the Volunteer Coordinators:
  </p>
  {{ message_to_user }}
  <p>
    Your Friendly Black Rock Ranger Volunteer Coordinators
  </p>
  {% render "shared/mailer/application_footer", application: application %}
