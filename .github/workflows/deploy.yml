# Docs: https://docs.github.com/en/actions
#
# Promote the image staging runs to production, by hand, from the Actions tab.
# Slice 5 of .scratch/github-cicd/PRD.md, written before the AWS side exists:
# the steps that touch AWS are commented out below, and the job fails at once
# with a note until they are uncommented. Modeled on burningmantech/ranger-ims-go.

name: Deploy to production
run-name: Deploy to production by @${{ github.actor }}

permissions:
  contents: read

on: workflow_dispatch

defaults:
  run:
    shell: bash

jobs:

  push-to-production:
    name: Deploy to production

    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: us-west-2
      AWS_DEPLOY_ROLE: "arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/ranger-gha-deploy"
      AWS_ECR_IMAGE_NAME: /rangers/ranger-clubhouse-rails
      AWS_ECS_CLUSTER: rangers
      AWS_ECS_CONTAINER_NAME: ranger-clubhouse
      AWS_ECS_SERVICE: ranger-clubhouse-production-fg
      AWS_ECS_TASK_DEFINITION_FAMILY: ranger-clubhouse-production-fg

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      # Only these accounts deploy production. Add a login to the list to let
      # someone in; a run by anyone else stops here.
      - name: Check user
        if: ${{ ! contains('["mikeburg"]', github.actor) }}
        run: |
          echo "::error::${{ github.actor }} is not on the production deploy list." >&2
          exit 1

      # Remove this step when the AWS steps below are uncommented.
