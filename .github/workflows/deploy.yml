# Docs: https://docs.github.com/en/actions


name: Deploy to production
run-name: Deploy to production by @${{ github.actor }}

on: workflow_dispatch

# Nothing here reads the repository: the job reads ECS, tags images in ECR and rolls the service.
permissions: {}

# One promotion at a time.
concurrency:
  group: deploy-production
  cancel-in-progress: false


defaults:
  run:
    shell: bash


env:
  AWS_ECR_IMAGE_NAME: "/rangers/${{ vars.PROJECT_ID }}"
  AWS_ECS_CLUSTER: "rangers"
  AWS_ECS_CONTAINER_NAME: "${{ vars.PROJECT_ID }}"
  AWS_REGION: "us-west-2"
  # The GitHub accounts that may promote to production, as a JSON list. Grown on request.
  DEPLOYERS: '["wsanchez", "mikeburg", "srabraham"]'

jobs:

  push-to-production:

    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      id-token: write

    steps:

      - name: Harden CI
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            *.amazonaws.com:443

      # fromJSON makes this a membership test rather than a substring one. A re-run keeps the
      # original github.actor, so the account that pressed re-run is checked as well.
      - name: Check user
        if: ${{ !contains(fromJSON(env.DEPLOYERS), github.actor) || !contains(fromJSON(env.DEPLOYERS), github.triggering_actor) }}
        run: |
          echo "::error::Not on the production deploy list: ${GITHUB_ACTOR} (triggered by ${GITHUB_TRIGGERING_ACTOR})"
          exit 1

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: "arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/ranger-gha-deploy"
          role-session-name: ranger-gha-${{ github.repository_id }}-${{ github.job }}-${{ github.run_id }}

      - name: Login to AWS ECR
        id: aws-login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Name the ECR repository
        run: echo "IMAGE_REPOSITORY=${{ steps.aws-login-ecr.outputs.registry }}${{ env.AWS_ECR_IMAGE_NAME }}" >> "${GITHUB_ENV}"

      # Production runs what staging's last completed deployment runs. Its task definition is the
      # record: the image, by digest since cicd.yml started pinning it, and the commit in GIT_SHA,
      # both written by the render that rolled it. A tag could lag a roll or a manual rollback;
      # the task definition cannot. Read it only through --query: it holds credentials.
      - name: Resolve the image staging runs
        id: staging
        run: |
          deployment=$(aws ecs describe-services --cluster "${AWS_ECS_CLUSTER}" --services "${{ vars.PROJECT_ID }}-staging-fg" --query 'services[0].deployments[?status==`PRIMARY`]|[0].[rolloutState, taskDefinition]' --output text)
          read -r state task_definition <<< "${deployment}"
          if [[ "${state}" != "COMPLETED" ]]; then
            echo "::error::Staging's deployment is ${state}; promote once it has completed"
            exit 1
          fi
          container=$(aws ecs describe-task-definition --task-definition "${task_definition}" --query 'taskDefinition.containerDefinitions[?name==`${{ env.AWS_ECS_CONTAINER_NAME }}`]|[0].[image, environment[?name==`GIT_SHA`]|[0].value]' --output text)
          read -r image git_sha <<< "${container}"
          if [[ ! "${git_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::${task_definition} carries no GIT_SHA, so cicd.yml did not register it"
            exit 1
          fi
          # Revisions from before the digest pin name the image by tag.
          if [[ "${image}" == *@sha256:* ]]; then
            digest="${image##*@}"
          else
            digest=$(docker buildx imagetools inspect "${image}" --format '{{.Manifest.Digest}}')
          fi
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Could not resolve ${image} to a digest: ${digest}"
            exit 1
          fi
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "git_sha=${git_sha}" >> "${GITHUB_OUTPUT}"
          echo "Promoting commit ${git_sha}, image ${digest}, from ${task_definition##*/}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Get current date
        id: date
        run: echo "date=$(date -u "+%Y-%m-%dT%H:%M:%SZ")" >> "${GITHUB_OUTPUT}"

      - name: Fetch and update current task definition
        id: new-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@8d79160660ad39c402a16e5fc7cd2a32e8f7d6b7 # v1.9.1
        with:
          task-definition-arn: "arn:aws:ecs:us-west-2:${{ secrets.AWS_ACCOUNT_ID }}:task-definition/${{ vars.PROJECT_ID }}-production-fg"
          task-definition-family: "${{ vars.PROJECT_ID }}-production-fg"
          container-name: "${{ env.AWS_ECS_CONTAINER_NAME }}"
          image: "${{ env.IMAGE_REPOSITORY }}@${{ steps.staging.outputs.digest }}"
          environment-variables: |
            GHA_ACTOR_ID=${{ github.actor_id }}
            GHA_ACTOR=${{ github.actor }}
            GHA_EVENT_NAME=${{ github.event_name }}
            GHA_JOB=${{ github.job }}
            GHA_REF=${{ github.ref }}
            GHA_RUN_ATTEMPT=${{ github.run_attempt }}
            GHA_RUN_ID=${{ github.run_id }}
            GHA_RUN_NUMBER=${{ github.run_number }}
            GHA_TRIGGERING_ACTOR=${{ github.triggering_actor }}
            GHA_WORKFLOW=${{ github.workflow }}
            GIT_SHA=${{ steps.staging.outputs.git_sha }}
            TASK_UPDATED=${{ steps.date.outputs.date }}

      # db:migrate runs inside the task: a `migrate` container, a copy of the web container running
      # bin/rails deploy:migrate (lib/deploy_migration_guard.rb), that the web container waits on
      # (dependsOn SUCCESS). A failed migration stops the task before the web container starts, and
      # the circuit breaker rolls the service back. The copy is rebuilt from the rendered web
      # container on every roll, because the render step edits only the web container; for the same
      # reason, deleting this step would leave the last build's migrate container in every later
      # revision, migrating nothing new, so retiring it takes a roll that deletes the container and
      # its dependsOn entry. No startTimeout: ECS gives up on a dependency only when one is set, and
      # Fargate caps it at 120 s. The rendered file holds credentials, so nothing here prints it.
      # test/lib/deploy_workflows_test.rb runs this step and checks both workflows carry it unchanged.
      - name: Add the migrate container
        id: with-migrate
        env:
          RENDERED: ${{ steps.new-task-definition.outputs.task-definition }}
        run: |
          out="${RUNNER_TEMP}/task-definition-with-migrate.json"
          jq --arg web "${AWS_ECS_CONTAINER_NAME}" '
            .containerDefinitions |= map(select(.name != "migrate"))
            | (.containerDefinitions[] | select(.name == $web)) as $web_def
            | [$web_def.dependsOn // [] | .[] | select(.containerName != "migrate")] as $others
            | .containerDefinitions += [
                $web_def
                | del(.portMappings, .healthCheck, .dependsOn, .startTimeout, .stopTimeout, .cpu, .memory, .memoryReservation)
                | .name = "migrate"
                | .essential = false
                | .command = ["bin/rails", "deploy:migrate"]
                | if $others == [] then . else .dependsOn = $others end
              ]
            | (.containerDefinitions[] | select(.name == $web)).dependsOn = $others + [{containerName: "migrate", condition: "SUCCESS"}]
          ' "${RENDERED}" > "${out}"
          # An entryPoint on the web container would run in the migrate container too, so it stops
          # the deploy for a person to decide.
          jq -e --arg web "${AWS_ECS_CONTAINER_NAME}" '
            def one(n): [.containerDefinitions[] | select(.name == n)] | select(length == 1) | .[0];
            (one("migrate") | .essential == false and .startTimeout == null and .portMappings == null
              and .entryPoint == null and .command == ["bin/rails", "deploy:migrate"]
              and [.dependsOn[]? | select(.containerName == "migrate")] == [])
            and (one("migrate") | .image) == (one($web) | .image)
            and (one($web) | .essential == true
              and [.dependsOn[] | select(.containerName == "migrate")] == [{containerName: "migrate", condition: "SUCCESS"}])
          ' "${out}" > /dev/null || {
            echo "::error::The migrate container did not come out as this step's assertion expects"
            exit 1
          }
          echo "task-definition=${out}" >> "${GITHUB_OUTPUT}"

      - name: Update task definition and ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@a00d4d57ac0de1a99b39fe469f3d898d38717c2b # v2.6.4
        timeout-minutes: 12
        with:
          task-definition: "${{ steps.with-migrate.outputs.task-definition }}"
          service: "${{ vars.PROJECT_ID }}-production-fg"
          cluster: "${{ env.AWS_ECS_CLUSTER }}"
          wait-for-service-stability: true
          wait-for-minutes: 10
          # The SDK's default backoff can give up after six polls, well inside the ten minutes.
          wait-max-delay-seconds: 15

      # :production is a pointer for people to the image the last production roll that stayed up
      # put there; nothing deploys from it. Retagging in the registry moves no bytes.
      - name: Move the production tag
        run: docker buildx imagetools create --prefer-index=false --tag "${IMAGE_REPOSITORY}:production" "${IMAGE_REPOSITORY}@${{ steps.staging.outputs.digest }}"

#      # Training needs the "Add the migrate container" step above before this deploy is enabled,
#      # and its config/database.yml entry needs schema_dump: false first: without it, db:migrate on
#      # a database with no schema_migrations loads db/schema.rb, which drops every table it defines.
