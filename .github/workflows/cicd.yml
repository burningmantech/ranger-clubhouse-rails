# Docs: https://docs.github.com/en/actions

name: CI/CD

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]


defaults:
  run:
    shell: bash


env:
  AWS_ECR_IMAGE_NAME: "/rangers/${{ vars.PROJECT_ID }}"
  AWS_ECS_CLUSTER: "rangers"
  AWS_ECS_CONTAINER_NAME: "${{ vars.PROJECT_ID }}"
  AWS_REGION: us-west-2
  # Production runs on Phoenix time, and so do the tests: datetimes are stored
  # as the process's local wall clock (config.active_record.default_timezone).
  TZ: America/Phoenix


jobs:

  lint:
    name: Lint

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # importmap audit boots the app, and ruby-vips loads libvips on boot.
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips42t64

      - name: Set up Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          bundler-cache: true

      - name: RuboCop
        run: bin/rubocop

      - name: Brakeman
        run: bin/brakeman --no-pager

      - name: CSS ratchet
        run: ruby bin/css_lint.rb --strict

      - name: Importmap audit
        run: bin/importmap audit


  # The system tests get a runner of their own: eight Chromes on four cores
  # cost the rest of the suite more than the second job's setup does.
  test:
    name: ${{ matrix.suite == 'system' && 'System tests' || 'Tests' }}

    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        suite: [unit, system]

    services:
      mariadb:
        image: mariadb:12.3.3
        env:
          MARIADB_ROOT_PASSWORD: donothing
          MARIADB_USER: rangers
          MARIADB_PASSWORD: donothing
          MARIADB_DATABASE: clubhouse3_test
          TZ: ${{ env.TZ }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      RAILS_ENV: test
      CI: true
      # Eight workers suit the database-bound unit tests. The system tests each
      # drive a Chrome, and eight of them on the runner's four cores time out
      # (search results in 5s, a dialog in 2s); four is one per core.
      PARALLEL_WORKERS: ${{ matrix.suite == 'system' && '4' || '8' }}

    steps:

      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ruby-vips needs only the shared library. Ubuntu ships libheif's HEVC
      # decoder as a separate plugin; without it a HEIC photo upload fails to
      # decode (Debian and Homebrew bundle it). The MySQL client library is on
      # the runner image already.
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips42t64 libheif-plugin-libde265

      - name: Set up Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # Tailwind resolves the daisyUI plugin from node_modules.
      - name: Build CSS
        run: npm ci && bin/rails tailwindcss:build

      # The test workers each create their own database (clubhouse3_test-<n>).
      # The runner has no MariaDB client; the service container does.
      - name: Let the test user create databases
        run: docker exec ${{ job.services.mariadb.id }} mariadb --user root --password=donothing -e "GRANT ALL ON *.* TO 'rangers'@'%'"

      - name: Prepare the database
        run: bin/rails db:prepare

      - name: Run tests
        run: bin/rails ${{ matrix.suite == 'system' && 'test:system' || 'test' }}

      - name: Keep failed system-test screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: screenshots
          path: tmp/screenshots
          if-no-files-found: ignore
          retention-days: 7


  docker-build:

    name: Build Docker image

    # Fargate runs the image on arm64 (Graviton); build it natively.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20

    steps:

      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: "${{ vars.PROJECT_ID }}:${{ github.sha }}"
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # `load: true` exports to the local Docker daemon, which can't take the
          # attestation manifest list that buildx would otherwise attach.
          provenance: false

      # nginx -t as the image's user proves nginx.conf and everything it includes; check.sh
      # runs the filters against an echo server standing in for Puma, so every one still
      # refuses what it should and every real route still gets through (docker/nginx/).
      - name: Check the nginx config
        run: |
          docker run --rm --entrypoint nginx "${{ vars.PROJECT_ID }}:${{ github.sha }}" -t -c /app/docker/nginx/nginx.conf
          docker run --rm --entrypoint /app/docker/nginx/check.sh "${{ vars.PROJECT_ID }}:${{ github.sha }}"

      # The deploy job of the same run will push this image, so it never has
      # to be built twice.
      - name: Save Docker image
        run: docker image save "${{ vars.PROJECT_ID }}:${{ github.sha }}" | gzip -9 > docker_image.tgz

      - name: Upload Docker image artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker
          path: docker_image.tgz


  deploy-staging:
    name: Deploy to staging

    needs: [lint, test, docker-build]
    if: ${{ github.ref == 'refs/heads/main' }}

    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      id-token: write

    steps:

      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            *.amazonaws.com:443
            *.docker.io:443

      - name: Download Docker image artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docker

      - name: Load Docker image
        run: gzip --uncompress --stdout docker_image.tgz | docker image load

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: "${{ env.AWS_REGION }}"
          role-to-assume: "arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/ranger-gha-deploy"
          role-session-name: "ranger-gha-${{ github.repository_id }}-${{ github.job }}-${{ github.run_id }}"

      - name: Login to AWS ECR
        id: aws-login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Push docker image to Amazon ECR
        run: |
          image_repository="${{ steps.aws-login-ecr.outputs.registry }}${{ env.AWS_ECR_IMAGE_NAME }}"
          docker login
          # Push SHA tag
          docker tag "${{ vars.PROJECT_ID }}:${{ github.sha }}" "${image_repository}:${{ github.sha }}"
          docker push "${image_repository}:${{ github.sha }}"
          # Push staging rollback tag
          if docker pull "${image_repository}:staging"; then
            echo "Pushing rollback tag for staging"
            docker tag "${image_repository}:staging" "${image_repository}:staging_rollback"
            docker push "${image_repository}:staging_rollback"
          fi
          # Push staging tag
          echo "Pushing staging tag"
          docker tag "${image_repository}:${{ github.sha }}" "${image_repository}:staging"
          docker push "${image_repository}:staging"

      - name: Get current date
        id: date
        run: echo "date=$(date "+%Y-%m-%dT%H:%M:%S")" >> "${GITHUB_OUTPUT}"

      - name: Fetch and update current task definition
        id: new-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@8d79160660ad39c402a16e5fc7cd2a32e8f7d6b7 # v1.9.1
        with:
          task-definition-arn: "arn:aws:ecs:us-west-2:${{ secrets.AWS_ACCOUNT_ID }}:task-definition/${{ vars.PROJECT_ID }}-staging-fg"
          task-definition-family: "${{ vars.PROJECT_ID }}-staging-fg"
          container-name: "${{ env.AWS_ECS_CONTAINER_NAME }}"
          image: "${{ steps.aws-login-ecr.outputs.registry }}${{ env.AWS_ECR_IMAGE_NAME }}:${{ github.sha }}"
          environment-variables: |
            GHA_ACTOR_ID=${{ github.actor_id }}
            GHA_ACTOR=${{ github.actor }}
            GHA_EVENT_NAME=${{ github.event_name }}
            GHA_JOB=${{ github.job }}
            GHA_REF=${{ github.ref }}
            GHA_RUN_ATTEMPT=${{ github.run_attempt }}
            GHA_RUN_ID=${{ github.run_id }}
            GHA_RUN_NUMBER=${{ github.run_number }}
            GHA_TRIGGERING_ACTOR=${{ github.triggering_actor }}
            GHA_WORKFLOW=${{ github.workflow }}
            GIT_SHA=${{ github.sha }}
            TASK_UPDATED=${{ steps.date.outputs.date }}

      - name: Update task definition and ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@a00d4d57ac0de1a99b39fe469f3d898d38717c2b # v2.6.4
        timeout-minutes: 12
        with:
          task-definition: "${{ steps.new-task-definition.outputs.task-definition }}"
          service: "${{ vars.PROJECT_ID }}-staging-fg"
          cluster: "${{ env.AWS_ECS_CLUSTER }}"
          wait-for-service-stability: true
          wait-for-minutes: 10
