# Docs: https://docs.github.com/en/actions
#
# Every pull request: lint, tests, Docker image build. The deploy jobs
# (staging on a merge to main, production by hand) are the next slices of
# .scratch/github-cicd/PRD.md and follow burningmantech/ranger-ims-go.

name: CI/CD

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:

# A newer push to a pull request cancels its older run. A merge to main never
# cancels the run before it, which may be rolling staging.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  # Production runs on Phoenix time, and so do the tests: datetimes are stored
  # as the process's local wall clock (config.active_record.default_timezone).
  TZ: America/Phoenix

jobs:

  lint:
    name: Lint

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # importmap audit boots the app, and ruby-vips loads libvips on boot.
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips42t64

      - name: Set up Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          bundler-cache: true

      - name: RuboCop
        run: bin/rubocop

      - name: Brakeman
        run: bin/brakeman --no-pager

      - name: CSS ratchet
        run: ruby bin/css_lint.rb --strict

      - name: Importmap audit
        run: bin/importmap audit


  # The system tests get a runner of their own: eight Chromes on four cores
  # cost the rest of the suite more than the second job's setup does.
  test:
    name: ${{ matrix.suite == 'system' && 'System tests' || 'Tests' }}

    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        suite: [unit, system]

    services:
      mariadb:
        image: mariadb:12.3.3
        env:
          MARIADB_ROOT_PASSWORD: donothing
          MARIADB_USER: rangers
          MARIADB_PASSWORD: donothing
          MARIADB_DATABASE: clubhouse3_test
          TZ: America/Phoenix
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      RAILS_ENV: test
      CI: true
      # Eight workers suit the database-bound unit tests. The system tests each
      # drive a Chrome, and eight of them on the runner's four cores time out
      # (search results in 5s, a dialog in 2s); four is one per core.
      PARALLEL_WORKERS: ${{ matrix.suite == 'system' && '4' || '8' }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ruby-vips needs only the shared library. Ubuntu ships libheif's HEVC
      # decoder as a separate plugin; without it a HEIC photo upload fails to
      # decode (Debian and Homebrew bundle it). The MySQL client library is on
      # the runner image already.
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips42t64 libheif-plugin-libde265

      - name: Set up Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # Tailwind resolves the daisyUI plugin from node_modules.
      - name: Build CSS
        run: npm ci && bin/rails tailwindcss:build

      # The test workers each create their own database (clubhouse3_test-<n>).
      # The runner has no MariaDB client; the service container does.
      - name: Let the test user create databases
        run: docker exec ${{ job.services.mariadb.id }} mariadb --user root --password=donothing -e "GRANT ALL ON *.* TO 'rangers'@'%'"

      - name: Prepare the database
        run: bin/rails db:prepare

      - name: Run tests
        run: bin/rails ${{ matrix.suite == 'system' && 'test:system' || 'test' }}

      - name: Keep failed system-test screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: screenshots
          path: tmp/screenshots
          if-no-files-found: ignore
          retention-days: 7


  docker-build:
    name: Build Docker image

    # Fargate runs the image on arm64 (Graviton); build it natively.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          pull: true
          load: true
          tags: "ranger-clubhouse-rails:${{ github.sha }}"
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # `load: true` exports to the local daemon, which can't take the
          # attestation manifest list buildx would otherwise attach.
          provenance: false

      # The deploy job of the same run will push this image, so it never has
      # to be built twice.
      - name: Save Docker image
        run: docker image save "ranger-clubhouse-rails:${{ github.sha }}" | gzip -1 > docker_image.tgz

      - name: Upload Docker image artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker
          path: docker_image.tgz
          retention-days: 1


  # Deploy to staging: slice 3 of .scratch/github-cicd/PRD.md, written before
  # the AWS side exists. Uncomment the job once these do: the ECR repository
  # rangers/ranger-clubhouse-rails, the service and task definition family
