# Docs: https://docs.github.com/en/actions

name: CI/CD

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# A new push to a pull request cancels the run still going for its previous one (so does a re-run
# of an older run of the same pull request, which then needs the newer run re-run). A push to
# main gets a group of its own, so no main run is ever cancelled; deploy-staging queues itself.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true


defaults:
  run:
    shell: bash


env:
  AWS_ECR_IMAGE_NAME: "/rangers/${{ vars.PROJECT_ID }}"
  AWS_ECS_CLUSTER: "rangers"
  AWS_ECS_CONTAINER_NAME: "${{ vars.PROJECT_ID }}"
  AWS_REGION: us-west-2
  # Production runs on Phoenix time, and so do the tests: datetimes are stored
  # as the process's local wall clock (config.active_record.default_timezone).
  TZ: America/Phoenix


jobs:

  lint:
    name: Lint

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # importmap audit boots the app, and ruby-vips loads libvips on boot.
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips42t64

      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          bundler-cache: true

      - name: RuboCop
        run: bin/rubocop

      - name: Brakeman
        run: bin/brakeman --no-pager

      - name: CSS ratchet
        run: ruby bin/css_lint.rb --strict

      - name: Importmap audit
        run: bin/importmap audit


  # The system tests get a runner of their own: eight Chromes on four cores
  # cost the rest of the suite more than the second job's setup does.
  test:
    name: ${{ matrix.suite == 'system' && 'System tests' || 'Tests' }}

    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        suite: [unit, system]

    services:
      mariadb:
        image: mariadb:12.3.3
        env:
          MARIADB_ROOT_PASSWORD: donothing
          MARIADB_USER: rangers
          MARIADB_PASSWORD: donothing
          MARIADB_DATABASE: clubhouse3_test
          TZ: ${{ env.TZ }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      RAILS_ENV: test
      CI: true
      # Eight workers suit the database-bound unit tests. The system tests each
      # drive a Chrome, and eight of them on the runner's four cores time out
      # (search results in 5s, a dialog in 2s); four is one per core.
      PARALLEL_WORKERS: ${{ matrix.suite == 'system' && '4' || '8' }}

    steps:

      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ruby-vips needs only the shared library. Ubuntu ships libheif's HEVC
      # decoder as a separate plugin; without it a HEIC photo upload fails to
      # decode (Debian and Homebrew bundle it). The MySQL client library is on
      # the runner image already.
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips42t64 libheif-plugin-libde265

      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # Tailwind resolves the daisyUI plugin from node_modules.
      - name: Build CSS
        run: npm ci && bin/rails tailwindcss:build

      # The test workers each create their own database (clubhouse3_test-<n>).
      # The runner has no MariaDB client; the service container does.
      - name: Let the test user create databases
        run: docker exec ${{ job.services.mariadb.id }} mariadb --user root --password=donothing -e "GRANT ALL ON *.* TO 'rangers'@'%'"

      - name: Prepare the database
        run: bin/rails db:prepare

      - name: Run tests
        run: bin/rails ${{ matrix.suite == 'system' && 'test:system' || 'test' }}

      - name: Keep failed system-test screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && matrix.suite == 'system'
        with:
          name: screenshots
          path: tmp/screenshots
          if-no-files-found: ignore
          retention-days: 7


  docker-build:

    name: Build Docker image

    # Fargate runs the image on arm64 (Graviton); build it natively.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20

    steps:

      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: "${{ vars.PROJECT_ID }}:${{ github.sha }}"
          cache-from: type=gha
          # Only main exports the layer cache. Exports from every pull request branch filled the
          # repository's 10 GB, and eviction then took main's layers and the gem and npm caches.
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max' || '' }}
          # `load: true` exports to the local Docker daemon, which can't take the
          # attestation manifest list that buildx would otherwise attach.
          provenance: false

      # nginx -t as the image's user proves nginx.conf and everything it includes; check.sh
      # runs the filters against an echo server standing in for Puma, so every one still
      # refuses what it should and every real route still gets through (docker/nginx/).
      - name: Check the nginx config
        run: |
          docker run --rm --entrypoint nginx "${{ vars.PROJECT_ID }}:${{ github.sha }}" -t -c /app/docker/nginx/nginx.conf
          docker run --rm --entrypoint /app/docker/nginx/check.sh "${{ vars.PROJECT_ID }}:${{ github.sha }}"

      # The deploy job of the same run pushes this image, so it is never built twice. Only a
      # main run has that job; it and a re-run of it are the artifact's only readers, so it
      # lives as long as GitHub lets a run be re-run.
      - name: Save Docker image
        if: ${{ github.ref == 'refs/heads/main' }}
        run: docker image save "${{ vars.PROJECT_ID }}:${{ github.sha }}" | zstd -z > docker_image.tgz

      - name: Upload Docker image artifacts
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker
          path: docker_image.tgz
          # Already compressed: the action's own deflate pass would be most of the upload step.
          compression-level: 0
          retention-days: 30


  deploy-staging:
    name: Deploy to staging

    needs: [lint, test, docker-build]
    if: ${{ github.ref == 'refs/heads/main' }}

    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write

    # One staging roll at a time, every run kept in the queue. GitHub orders the queue by when
    # each job became ready, not by commit, so the first step is what keeps an older merge from
    # rolling over a newer one.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
      queue: max

    steps:

      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            *.amazonaws.com:443
            api.github.com:443

      # A slower run for an older merge, or a re-run of one, would otherwise roll staging
      # backwards. The run for main's tip rolls staging.
      - name: Stop if main has moved on
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tip=$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq .commit.sha)
          if [[ "${tip}" != "${GITHUB_SHA}" ]]; then
            echo "::error::main is at ${tip}; this run built ${GITHUB_SHA}, and the run for the tip rolls staging"
            exit 1
          fi

      - name: Download Docker image artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docker

      - name: Load Docker image
        run: zstd -d -c docker_image.tgz | docker image load

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: "${{ env.AWS_REGION }}"
          role-to-assume: "arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/ranger-gha-deploy"
          role-session-name: "ranger-gha-${{ github.repository_id }}-${{ github.job }}-${{ github.run_id }}"

      - name: Login to AWS ECR
        id: aws-login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Name the ECR repository
        run: echo "IMAGE_REPOSITORY=${{ steps.aws-login-ecr.outputs.registry }}${{ env.AWS_ECR_IMAGE_NAME }}" >> "${GITHUB_ENV}"

      # The task definition gets the digest, not the tag, so a replacement task can never pull
      # anything but this build.
      - name: Push the image to Amazon ECR
        id: push
        run: |
          docker tag "${{ vars.PROJECT_ID }}:${{ github.sha }}" "${IMAGE_REPOSITORY}:${{ github.sha }}"
          docker push "${IMAGE_REPOSITORY}:${{ github.sha }}"
          digest=$(docker buildx imagetools inspect "${IMAGE_REPOSITORY}:${{ github.sha }}" --format '{{.Manifest.Digest}}')
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Could not read the pushed image's digest: ${digest}"
            exit 1
          fi
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Get current date
        id: date
        run: echo "date=$(date -u "+%Y-%m-%dT%H:%M:%SZ")" >> "${GITHUB_OUTPUT}"

      - name: Fetch and update current task definition
        id: new-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@8d79160660ad39c402a16e5fc7cd2a32e8f7d6b7 # v1.9.1
        with:
          task-definition-arn: "arn:aws:ecs:us-west-2:${{ secrets.AWS_ACCOUNT_ID }}:task-definition/${{ vars.PROJECT_ID }}-staging-fg"
          task-definition-family: "${{ vars.PROJECT_ID }}-staging-fg"
          container-name: "${{ env.AWS_ECS_CONTAINER_NAME }}"
          image: "${{ env.IMAGE_REPOSITORY }}@${{ steps.push.outputs.digest }}"
          environment-variables: |
            GHA_ACTOR_ID=${{ github.actor_id }}
            GHA_ACTOR=${{ github.actor }}
            GHA_EVENT_NAME=${{ github.event_name }}
            GHA_JOB=${{ github.job }}
            GHA_REF=${{ github.ref }}
            GHA_RUN_ATTEMPT=${{ github.run_attempt }}
            GHA_RUN_ID=${{ github.run_id }}
            GHA_RUN_NUMBER=${{ github.run_number }}
            GHA_TRIGGERING_ACTOR=${{ github.triggering_actor }}
            GHA_WORKFLOW=${{ github.workflow }}
            GIT_SHA=${{ github.sha }}
            TASK_UPDATED=${{ steps.date.outputs.date }}

      # db:migrate runs inside the task: a `migrate` container, a copy of the web container running
      # bin/rails deploy:migrate (lib/deploy_migration_guard.rb), that the web container waits on
      # (dependsOn SUCCESS). A failed migration stops the task before the web container starts, and
      # the circuit breaker rolls the service back. The copy is rebuilt from the rendered web
      # container on every roll, because the render step edits only the web container; for the same
      # reason, deleting this step would leave the last build's migrate container in every later
      # revision, migrating nothing new, so retiring it takes a roll that deletes the container and
      # its dependsOn entry. No startTimeout: ECS gives up on a dependency only when one is set, and
      # Fargate caps it at 120 s. The rendered file holds credentials, so nothing here prints it.
      # test/lib/deploy_workflows_test.rb runs this step and checks both workflows carry it unchanged.
      - name: Add the migrate container
        id: with-migrate
        env:
          RENDERED: ${{ steps.new-task-definition.outputs.task-definition }}
        run: |
          out="${RUNNER_TEMP}/task-definition-with-migrate.json"
          jq --arg web "${AWS_ECS_CONTAINER_NAME}" '
            .containerDefinitions |= map(select(.name != "migrate"))
            | (.containerDefinitions[] | select(.name == $web)) as $web_def
            | [$web_def.dependsOn // [] | .[] | select(.containerName != "migrate")] as $others
            | .containerDefinitions += [
                $web_def
                | del(.portMappings, .healthCheck, .dependsOn, .startTimeout, .stopTimeout, .cpu, .memory, .memoryReservation)
                | .name = "migrate"
                | .essential = false
                | .command = ["bin/rails", "deploy:migrate"]
                | if $others == [] then . else .dependsOn = $others end
              ]
            | (.containerDefinitions[] | select(.name == $web)).dependsOn = $others + [{containerName: "migrate", condition: "SUCCESS"}]
          ' "${RENDERED}" > "${out}"
          # An entryPoint on the web container would run in the migrate container too, so it stops
          # the deploy for a person to decide.
          jq -e --arg web "${AWS_ECS_CONTAINER_NAME}" '
            def one(n): [.containerDefinitions[] | select(.name == n)] | select(length == 1) | .[0];
            (one("migrate") | .essential == false and .startTimeout == null and .portMappings == null
              and .entryPoint == null and .command == ["bin/rails", "deploy:migrate"]
              and [.dependsOn[]? | select(.containerName == "migrate")] == [])
            and (one("migrate") | .image) == (one($web) | .image)
            and (one($web) | .essential == true
              and [.dependsOn[] | select(.containerName == "migrate")] == [{containerName: "migrate", condition: "SUCCESS"}])
          ' "${out}" > /dev/null || {
            echo "::error::The migrate container did not come out as this step's assertion expects"
            exit 1
          }
          echo "task-definition=${out}" >> "${GITHUB_OUTPUT}"

      - name: Update task definition and ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@a00d4d57ac0de1a99b39fe469f3d898d38717c2b # v2.6.4
        timeout-minutes: 12
        with:
          task-definition: "${{ steps.with-migrate.outputs.task-definition }}"
          service: "${{ vars.PROJECT_ID }}-staging-fg"
          cluster: "${{ env.AWS_ECS_CLUSTER }}"
          wait-for-service-stability: true
          wait-for-minutes: 10
          # The SDK's default backoff can give up after six polls, well inside the ten minutes.
          wait-max-delay-seconds: 15

      # :staging is a pointer for people to the image the last staging roll that stayed up put
      # there; nothing deploys from it (deploy.yml reads the staging task definition). Retagging
      # in the registry moves no bytes.
      - name: Move the staging tag
        run: docker buildx imagetools create --prefer-index=false --tag "${IMAGE_REPOSITORY}:staging" "${IMAGE_REPOSITORY}:${{ github.sha }}"
